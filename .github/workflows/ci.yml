name: Kasho CI
on:
  push:
    branches: [main, kasho-rebrand-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build bundles
        run: npm run build
      - name: Package Windows installer (NSIS smoke test)
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload Windows installer for testing
        uses: actions/upload-artifact@v4
        with:
          name: Kasho-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Database initialization smoke test
        run: npm run test:database

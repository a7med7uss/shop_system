name: StoreFlow CI
on:
  push:
    branches: [main, storeflow-desktop-v1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Build bundles
        run: npm run build
      - name: Database initialization smoke test
        run: npm run test:database

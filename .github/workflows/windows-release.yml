name: Build StoreFlow Windows Installer
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Database initialization smoke test
        run: npm run test:database
      - name: Package installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release/StoreFlow-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  StoreFlow-Setup.exe" | Set-Content "release/StoreFlow-Setup.exe.sha256" -NoNewline
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/StoreFlow-Setup.exe
            release/StoreFlow-Setup.exe.sha256

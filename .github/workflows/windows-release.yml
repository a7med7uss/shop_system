name: Build Kasho Windows Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Type check and build
        run: npm run build
      - name: Database initialization smoke test
        run: npm run test:database
      - name: Package installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "release/Kasho-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Kasho-Setup.exe" | Set-Content "release/Kasho-Setup.exe.sha256" -NoNewline

      - name: Check whether Kasho v1.0.1 release already exists
        if: github.ref == 'refs/heads/main'
        id: first-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/v1.0.1"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          try {
            Invoke-RestMethod -Uri $uri -Headers $headers | Out-Null
            "publish=false" >> $env:GITHUB_OUTPUT
          } catch {
            $status = [int]$_.Exception.Response.StatusCode
            if ($status -eq 404) { "publish=true" >> $env:GITHUB_OUTPUT } else { throw }
          }

      - name: Publish Kasho v1.0.1 from main
        if: github.ref == 'refs/heads/main' && steps.first-release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          target_commitish: main
          name: Kasho v1.0.1
          generate_release_notes: true
          files: |
            release/Kasho-Setup.exe
            release/Kasho-Setup.exe.sha256
            Install-Kasho.bat

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Kasho-Setup.exe
            release/Kasho-Setup.exe.sha256
            Install-Kasho.bat
